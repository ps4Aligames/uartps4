name: Build UART Ali Games Edition

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build EXE
        shell: pwsh
        run: ./build.ps1

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: UART_Ali_Games_Edition-Windows
          path: dist/UART_Ali_Games_Edition.exe
