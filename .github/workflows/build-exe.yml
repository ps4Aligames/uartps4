name: Build UART Ali Games Edition

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller pyserial Pillow requests
      - name: Build EXE with Ali Games gold icon
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name 'UART_Ali_Games_Edition' --icon 'assets/AliGames.ico' --add-data 'assets;assets' src/uart_ali_games.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: UART-Ali-Games-Edition
          path: dist/UART_Ali_Games_Edition.exe
